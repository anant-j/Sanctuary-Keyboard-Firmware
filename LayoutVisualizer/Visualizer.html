<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Config Editor</title>
  <link rel="stylesheet" href="visualizer.css">
</head>
<body>
  <h1>Keyboard Config Editor</h1>

  <div class="controls">
    <label for="layerSelect">Select Layer:</label>
    <select id="layerSelect"></select>

    <button id="addLayer">Add Layer</button>
    <button id="removeLayer">Remove Selected Layer</button>
    <input type="file" id="loadFile" accept=".json" style="display:none;">
    <button id="loadConfig">Load Config</button>
    <button id="saveConfig">Save Config</button>
  </div>

  <div class="config-controls">
    <label for="rowsInput">Rows:</label>
    <input type="number" id="rowsInput" min="1" value="5">
    <label for="colsInput">Columns:</label>
    <input type="number" id="colsInput" min="1" value="12">
    <button id="updateLayout">Update Layout</button>
  </div>

  <div id="layerContainer"></div>

  <textarea id="configOutput" readonly></textarea>
  <br>
  <button id="generateConfig">Generate Config</button>
</body>
<script src="visualizer.js"></script>
</html>
